name: Orcave Windows Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-verify:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend-tauri
        run: npm ci

      - name: Build frontend
        working-directory: frontend-tauri
        run: npm run build

      - name: Test frontend
        working-directory: frontend-tauri
        run: npm run test -- --run

      - name: Check Rust workspace
        run: cargo check --locked --workspace --all-targets --jobs 2

      - name: Test Rust workspace libraries
        run: cargo test --locked --workspace --lib --jobs 2
